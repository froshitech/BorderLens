<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BorderLens</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0B0B0F;
      }
      #splash {
        --splash-ink: #0B0B0F;
        --splash-paper: #F4F2EE;
        --splash-accent: #FF4D2E;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0B0B0F;
        transition: opacity 0.4s ease-out;
        z-index: 99999999;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: min(84vw, 980px);
        height: auto;
        max-height: 85vh;
        overflow: visible;
        display: block;
      }
      #splash .ch {
        fill: var(--splash-paper);
        transform-box: fill-box;
        transform-origin: 50% 100%;
        opacity: 0;
        animation: splash_rise .55s cubic-bezier(.2,.8,.2,1) both;
        animation-delay: calc(1.05s + var(--i)*.07s);
        will-change: transform, opacity;
      }
      #splash .hy {
        fill: var(--splash-accent);
        transform-box: fill-box;
        transform-origin: 0 50%;
        transform: scaleX(0);
        animation: splash_wipe .4s cubic-bezier(.7,0,.2,1) 1.75s both;
        will-change: transform;
      }
      #splash .lens {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: splash_spin 1.3s cubic-bezier(.2,.7,.1,1) .15s both;
        will-change: transform;
      }
      #splash .ring {
        fill: none;
        stroke: var(--splash-paper);
        stroke-width: 12;
        stroke-dasharray: 277;
        stroke-dashoffset: 277;
        transform: rotate(-90deg);
        transform-origin: 50px 50px;
        animation: splash_draw .9s cubic-bezier(.6,0,.2,1) .15s forwards;
        will-change: stroke-dashoffset;
      }
      #splash .sp {
        stroke: var(--splash-paper);
        stroke-width: 6;
        stroke-linecap: round;
        fill: none;
        transform-box: view-box;
        opacity: 0;
        animation: splash_blade .35s ease-out both;
        animation-delay: calc(.7s + var(--k)*.06s);
        will-change: stroke-dashoffset, opacity;
      }
      #splash .dot {
        fill: var(--splash-accent);
        transform-box: fill-box;
        transform-origin: 50% 50%;
        transform: scale(0);
        animation: splash_pop .5s cubic-bezier(.3,1.6,.4,1) 1.15s both;
        will-change: transform;
      }
      @keyframes splash_draw {
        from { stroke-dashoffset: 277; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes splash_spin { from { transform: rotate(-140deg); } to { transform: rotate(0); } }
      @keyframes splash_blade { from { opacity: 0; stroke-dasharray: 22; stroke-dashoffset: 22; } to { opacity: 1; stroke-dasharray: 22; stroke-dashoffset: 0; } }
      @keyframes splash_pop { to { transform: scale(1); } }
      @keyframes splash_rise { from { opacity: 0; transform: translateY(22%); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash_wipe { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .ch, #splash .hy, #splash .lens, #splash .ring, #splash .sp, #splash .dot {
          animation: none !important;
          opacity: 1;
          transform: none;
          stroke-dashoffset: 0;
        }
        #splash .ring { transform: rotate(-90deg); }
      }
    </style>
  </head>

    <script>
      (function(){
        var el = document.getElementById('splash');
        if (!el) return;
        var ANIM_DURATION = 2300;
        var FADE_DURATION = 400;
        var dismissed = false;

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          el.classList.add('out');
          setTimeout(function(){
            try { el.remove(); } catch(e) { el.style.display = 'none'; }
            window.dispatchEvent(new Event('splash:done'));
          }, FADE_DURATION);
        }

        // Automatically direct to main page after splash animation ends
        var timer = setTimeout(dismiss, ANIM_DURATION);

        // Tap or click anywhere optionally skips directly to main page
        el.addEventListener('click', function(){
          clearTimeout(timer);
          dismiss();
        });
      })();
    </script>
